# Picked up automatically by native-image when this jar is on the classpath.
# Additional configuration (reflect-config.json, resource-config.json, ...) in
# this directory is also discovered automatically.
Args = --no-fallback \
       --features=clj_easy.graal_build_time.InitClojureClasses
JavaArgs = -Dclojure.spec.skip-macros=true
